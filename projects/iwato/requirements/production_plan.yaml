# =====================================================================
# 生産計画 — パイロットの知見を反映した素材の作り方
#
# 何を作るか（点数）は fields.json と ASSETS_NEEDED.md が持つ。
# **このファイルは「どう作るか」を持つ。**
#
# 根拠: docs/PILOT_FINDINGS.md
# 集計: python tools/aggregate_assets.py --project iwato --plan
# =====================================================================

schema_version: 1
project_id: iwato
based_on: パイロット10 generations の実測（2026-09-04）

# ---------------------------------------------------------------------
# 分類の軸
#   投影の問題は「高さのある物」にだけ起きる（PILOT_FINDINGS 第1節）。
#   したがってオブジェクトは**高さ**で仕分ける。
# ---------------------------------------------------------------------
classes:
  tileset_a:
    label: 地形ペア
    endpoint: /create-tileset
    rule: 高低差または明確な材質段差がある。境界線が「段差の陰影」として意味を持つ
    status: 実証済み
  tileset_b:
    label: 平坦な2素材
    endpoint: /create-tileset
    rule: 同一平面。境界線が「見切り材・敷居・目地」として意味を持つ場合のみ使う
    status: 未検証（境界線が邪魔にならないかを見る必要がある）
  tileset_roof:
    label: 屋根タイルセット
    endpoint: /create-tileset
    rule: 建物は屋根の面である。真上からは壁がほとんど見えない
    status: 未検証
  deco:
    label: 地面の装飾
    endpoint: /map-objects
    layer: ground_detail
    rule: 完全に平坦。真上でもアイソメでも形が変わらないため投影の影響を受けない
    status: 理屈上は安全。未検証
  object_low:
    label: 低い単体物
    endpoint: /map-objects
    layer: objects
    rule: 高さ1タイル程度。投影の歪みは小さいはずだが**実測していない**
    status: 未検証
  object_tall:
    label: 高い単体物
    endpoint: 未定
    layer: objects
    rule: 高さ2タイル以上。**パイロットで投影の破綻を実証した唯一の未解決領域**
    status: 未解決

# ---------------------------------------------------------------------
# 持ち越しの論点への回答
# ---------------------------------------------------------------------
resolved_questions:

  - id: flat_floor_endpoint
    question: 分類Bの「床タイル1種」は、どのエンドポイントで作るのか
    answer: |
      **/create-tileset を、ほぼ同じ2素材の組で使う。**
      lower と upper に「同じ床の微妙な差」を書く。
      例: lower="worn pale linoleum floor"
          upper="slightly darker scuffed linoleum floor"
      こうすると16タイルが「同じ床の濃淡バリエーション」になり、
      1タイルの繰り返しより反復が目立たない床が得られる。
      境界線は出るが、素材差が小さければ目立たない。
    rationale: |
      単一素材のタイルを1枚だけ作る手段が無い。/map-objects で作ると
      投影が保証されず、そもそも「タイル」として繋がる保証もない。
      /create-tileset なら正射影と接続が保証されている。
    status: 未検証。分類Bの1本で確かめる

  - id: deco_layer
    question: タイル化した白線・グレーチング等は ground と objects のどちらに置くか
    answer: |
      **ground に置く。** 具体的には TileMapLayer をもう1枚重ね、
      `ground` の上に `ground_detail` を敷く。
    rationale: |
      - プレイヤーはその上を歩く。objects に置くとプレイヤーと同じ高さの
        物として扱われ、Y ソートで前後関係が発生してしまう
      - マンホールも白線も**地面の一部**であり、地面と同じ平面にある
      - 接地影を落とす対象でもない
      レイヤー構成は ground / **ground_detail** / objects / overhead の4層になる。
    status: 確定

  - id: contact_shadow
    question: 接地影は屋根タイルに焼き込むのか、実行時に落とすのか
    answer: |
      **長く伸びる落ち影は Godot 側で実行時に落とす。**
      **接地部分の1〜2px だけを素材に描く。**
    rationale: |
      「暗さと受光面は実行時に作る」（PILOT_FINDINGS 第5節）と整合させる。
      パイロットの建物にはアイソメ前提の長い落ち影が焼き込まれており、
      真上見下ろしでは意味を持たなかった。時間帯で影の向きと長さが
      変わる以上、焼き込むと4時間帯分の素材が必要になり破綻する。

      ただし接地影を完全に無くすと物が浮いて見える。
      **「そこに物がある」ことを示す最小限の1〜2px だけ**は素材に描く。
      これは時間帯で変わらない。
    status: 確定

