# ---------------------------------------------------------------------
# 屋根タイルセット
#   建物14点を、屋根の材質ごとにまとめる。1棟につき1本ではない。
# ---------------------------------------------------------------------
roof_tilesets:
  roof_kawara:
    class: tileset_roof
    note: 瓦屋根。和風住宅・寺社・駄菓子屋
    replaces: [obj_house_facade_showa, obj_shop_facade_shutter, obj_wooden_hall_facade]
  roof_corrugated:
    class: tileset_roof
    note: トタン屋根。農機具小屋・古い商店
    replaces: [obj_farm_shed]
  roof_flat_concrete:
    class: tileset_roof
    note: 陸屋根。団地・市民センター・交番・コンビニ・ロードサイド店
    replaces: [obj_danchi_facade, obj_civic_facade, obj_police_box, obj_conveni_front,
               obj_shop_facade_roadside, obj_house_facade_newtown]
  roof_wooden_school:
    class: tileset_roof
    note: 木造校舎の屋根。旧校舎・体育館
    replaces: [obj_wooden_school_facade, obj_gym_facade]
  roof_shrine:
    class: tileset_roof
    note: 社殿の屋根。神社・観音堂
    replaces: [obj_shrine_facade, obj_shrine_small]

# ---------------------------------------------------------------------
# 地面の装飾（ground_detail レイヤー）
#   タイルセットから外した特徴と、もともと平坦だったオブジェクト。
# ---------------------------------------------------------------------
deco:
  deco_line_parking:  { class: deco, note: "駐車場の白線。tile_parking_line から分離。統制語彙からも painted_line を削除した（素材ではなく特徴）" }
  deco_line_gym:      { class: deco, note: 体育館のライン。tile_gym_floor から分離 }
  deco_grating:       { class: deco, note: グレーチング。tile_asphalt_curb から分離 }
  deco_manhole:       { class: deco, note: マンホール蓋。新規。日本の路面の記号 }
  deco_road_marking:  { class: deco, note: 停止線・横断歩道などの路面標示。新規 }
  obj_side_ditch_cover:  { class: deco, note: 側溝の蓋。もともと平坦 }
  obj_foundation_stone:  { class: deco, note: 礎石。地面すれすれ }
  obj_irrigation_channel: { class: deco, note: 用水路。地面に彫られた溝 }

# ---------------------------------------------------------------------
# 未解決 — 高さのある単体物
#   **ここだけが未解決である。規模は24点。**
#   次の検証: obj_vending_machine を /create-tileset で作れるか（3〜4 generations）
# ---------------------------------------------------------------------
unresolved:
  count: 24
  note: |
    パイロットで投影の破綻を実証した唯一の領域。
    /map-objects はアイソメ、/create-image-pixflux は正面立面になる。

    検討中の案:
      (b) /create-tileset で単一素材として作り、必要な形に切り出す
      (d) 手描き／別ツール
      (e) タイルで表現できるものはタイルへ寄せ、真に単体の物だけを別手段で作る
  candidates_for_tiling: |
    24点のうち、タイルへ寄せられる可能性があるもの:
      obj_noise_barrier   … 防音壁は連続する壁。タイルセット向き
      obj_block_wall      … 同上（現在は low に分類）
      obj_wire_fence      … 同上
      obj_guardrail       … 同上
      obj_backstop        … 面として扱える
    連続する構造物はタイルセットに向く。**単体で立つ物だけが本当に未解決。**

# ---------------------------------------------------------------------
# 全タイルセットの特徴混入チェック（PILOT_FINDINGS 第2節）
#   「たまにある特徴」を素材の記述に含めていないか。
# ---------------------------------------------------------------------
feature_audit:
  checked: 22
  found: 3
  items:
    - { tileset: tile_asphalt_curb, feature: グレーチング, action: deco_grating へ分離 }
    - { tileset: tile_parking_line, feature: 白線, action: deco_line_parking へ分離 }
    - { tileset: tile_gym_floor,    feature: 体育館のライン, action: deco_line_gym へ分離 }
  clean: |
    残り19本は均質な素材どうしの組であり、特徴を含んでいない。
    ただし**記述を書く段階で再度点検すること。** fields.json の
    terrain_vocabulary には特徴語が含まれていないが、
    プロンプトを書くときに「白線」「マンホール」等を足さないこと。

# ---------------------------------------------------------------------
# 高さのある単体物24点の絞り込み（2026-09-04）
#
# **軸は「真上から見たときに何が見えるか」。**
# 垂直な物は、真上から見れば上面しか見えない。地上に立つ姿を
# 作る必要がない物は、別の作り方へ移せる。
# ---------------------------------------------------------------------
tall_triage:

  to_overhead:
    reason: |
      **真上から見ると、葉のある樹木は樹冠しか見えない。幹は見えない。**
      すでに overhead に樹冠（ovh_tree_canopy_cedar / broadleaf）があるため、
      幹のオブジェクトは不要である。隧道の照明も天井付きであり overhead。
    items:
      obj_cedar_trunk:     { merge_into: ovh_tree_canopy_cedar, note: F16 の杉。真上からは樹冠のみ }
      obj_persimmon_tree:  { merge_into: ovh_tree_canopy_broadleaf, note: F04 の柿。同上 }
      obj_chestnut_tree:   { merge_into: ovh_tree_canopy_broadleaf, note: F04 の栗。同上 }
      obj_tunnel_light:    { merge_into: ovh_viaduct_deck, note: 隧道の天井に付く照明。overhead 側 }
    count: 4

  to_tileset:
    reason: |
      **連続する構造物はタイルセットに向く。** 1点の物ではなく、
      長く続く面である。地面 × 構造物の組で /create-tileset を使える。
    items:
      obj_noise_barrier: { note: "防音壁。F03/F09 を長く貫く。地面 × 壁の組" }
      obj_backstop:      { note: バックネット。金網の面として連続する }
    count: 2

  merge:
    reason: |
      **形が同じで色だけが違う物は、1点作ってパレット置換で分ける。**
      時間帯差分と同じ考え方であり、素材を増やさずに済む。
    items:
      obj_street_light_mercury:
        merge_into: obj_street_light_led
        note: |
          ポールと灯具の形は同じ。違うのは光源色（ナトリウム橙 対 LED 青白）だけで、
          それはパレットの sodium と fluoro の差し替えで表現できる。
          **この色差はレジームA と B の分かれ目そのもの**であり重要だが、
          形状の素材を2点持つ必要はない。
      obj_vending_machine_old:
        merge_into: obj_vending_machine
        note: |
          F05 の古い自販機。筐体の形は同じ。褪せ具合はパレット置換で表現できる。
    count: 2

  unresolved:
    reason: |
      **真上から見ても「立っている姿」を描く必要がある物。**
      ここが投影の問題が残る唯一の領域である。
    items:
      - { id: obj_utility_pole,       fields: 12, note: "**最優先。12フィールドで使う最頻の素材**" }
      - { id: obj_street_light_led,   fields: 4,  note: 街灯。mercury を統合済み }
      - { id: obj_signboard_pole,     fields: 3,  note: 標識・案内板 }
      - { id: obj_vending_machine,    fields: 4,  note: "_old を統合済み。品質基準あり" }
      - { id: obj_torii,              fields: 2,  note: 鳥居 }
      - { id: obj_temple_gate,        fields: 2,  note: 山門 }
      - { id: obj_swing_set,          fields: 2,  note: ブランコ }
      - { id: obj_bulletin_board,     fields: 2,  note: 掲示板 }
      - { id: obj_bridge_pier,        fields: 1,  note: "橋脚。ただし overhead の高架に隠れる可能性がある" }
      - { id: obj_plum_tree_bare,     fields: 1,  note: "**葉が無いため樹冠へ統合できない。** F08 の核となる画" }
      - { id: obj_flag_pole,          fields: 1,  note: 校庭の掲揚塔 }
      - { id: obj_goal_post,          fields: 1,  note: ゴールポスト }
      - { id: obj_school_gate,        fields: 1,  note: 学校の正門 }
      - { id: obj_bus_stop_pole,      fields: 1,  note: バス停のポール }
      - { id: obj_road_mirror,        fields: 1,  note: カーブミラー }
      - { id: obj_public_phone,       fields: 1,  note: 公衆電話 }
    count: 16

  summary:
    before: 24
    to_overhead: 4
    to_tileset: 2
    merged: 2
    after: 16
    note: |
      **24点 → 16点（33%削減）。**
      残る16点が、投影の問題が本当に残っている範囲である。

      うち **obj_utility_pole は12フィールドで使う最頻の素材**であり、
      これが解決すれば影響範囲の大部分が片付く。
      逆に言えば、電柱1点の成否が量産の可否をほぼ決める。

