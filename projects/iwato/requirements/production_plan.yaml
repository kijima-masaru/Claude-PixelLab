  tile_concrete_grass: { class: tileset_a, note: コンクリートの縁から草 }
  tile_gravel_grass:   { class: tileset_a, note: 砂利と草 }
  tile_forest_floor:   { class: tileset_a, note: 林床と下草 }
  tile_asphalt_grass:  { class: tileset_a, note: アスファルトの割れ目から草 }
  tile_infield:        { class: tileset_a, note: 芝と土のグラウンド }
  tile_stone_steps:    { class: tileset_a, note: 石段。実際に段差がある }
  tile_bridge_deck:    { class: tileset_a, note: "橋面 × 縁石" }
