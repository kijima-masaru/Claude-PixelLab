# =====================================================================
# 磐戸町奇譚 72色パレットの定義
#
# **色を直接並べず、系統ごとの「ランプ（明度段の列）」として定義する。**
# 時間帯差分をパレット置換で作る方針が確定しているため、置換が
# 「段のシフト」として成立する構造でなければならない。個別に色を
# 選んで並べると、置換先がパレット内に存在しない事態が起きる。
#
# 生成: python tools/build_palette.py --project iwato
# =====================================================================

# =====================================================================
# ★ パレットの規約 — **色数ではなく彩度が本質である**
#
# 64色という枠を 72色へ広げた（2026-09-04）。したがって
# **「色数を増やしてよい」という規約ではない。** 増やしてよいのは
# 段数であって、鮮やかさではない。歯止めは彩度に置く。
#
#   1. **地の色は彩度 0.40 以下。ただし明度20以下の暗部は除く。**
#      色数の枠ではなく、これが褪せた画面を担保している唯一の規律である。
#      `color_image` によるパレット強制が機能したのは（PILOT_FINDINGS 第4節）、
#      出せる色が褪せているからであって、64個だったからではない。
#
#      **暗部を除くのは抜け道ではない。** 彩度は明度が無ければ知覚されない。
#      藍の最暗段 #040510 は彩度0.60 だが明度4であり、ほぼ黒にしか見えない。
#      「例外を設けない」と最初に書いたが、**その時点で藍ランプの暗端4段が
#      すでに違反していた。** 規約は実態に合わせて正した（build_palette.py が
#      機械的に検査する）。
#
#   2. **鮮やかさが許されるのは光源色だけ。**
#      自販機・街灯・蛍光灯・月・懐中電灯・コンビニの窓。
#      光源は時間帯置換の対象にもしない。
#
#   3. **光源色は 12色を上限とする。**
#      増やす場合は個別に承認を得ること。地の色の段数追加とは扱いが違う。
#
#   4. **新たな色を足すときは、なぜその色相・彩度が要るのかをここに残す。**
#      感想ではなく**欠落の実測**を根拠にすること。
#      例（olive / warm を足したときの根拠）:
#          色相 45〜100度（オリーブ・黄緑）        … 0色 / 64色
#          色相 20〜50度 かつ 彩度0.16未満（暖かい灰）… 0色 / 64色
#      緑と土のあいだに色相の穴が空いており、混ぜるほど両者が対立して
#      迷彩柄になっていた。**層をどう調整しても解けない構造的な欠落だった。**
# =====================================================================

name: iwato
max_colors: 76

# ---------------------------------------------------------------------
# 測定に基づく設計値（PALETTE_ANALYSIS.md に根拠を記載）
# ---------------------------------------------------------------------
targets:
  light_shadow_ratio: 8.0      # 光部と影部の明度比。ゲーム画面9点の中央値
  hue_shift_deg: 32            # 光と影の色相差。同上
  shadow_saturation_gain: 1.8  # 影の彩度 ÷ 光の彩度。実写を含めた再測定値
  dark_steps_min: 10           # 暗部に必要な階調段数。プレイ可能性の下限

# ---------------------------------------------------------------------
# ランプ定義
#   hue          色相（度）。start と end で系統内のドリフトを表す
#   sat          彩度（0-1）。暗い側 → 明るい側
#   light        明度（0-100）。暗い側 → 明るい側
#   gamma        明度の配分。1より大きいほど暗部に段を厚く割く
#   count        段数
# ---------------------------------------------------------------------
ramps:
  - key: ink
    label: 墨・無彩色
    role: 明度の基準軸。夜の最暗部から白線・蛍光灯の反射まで
    hue: { start: 224, end: 208 }
    sat: { start: 0.14, end: 0.02 }
    light: { start: 3, end: 94 }
    gamma: 1.5
    count: 9

  - key: concrete
    label: コンクリート・アスファルト
    role: 本作で最も面積を占める。青みを帯びた灰。湿度を色で表す主役
    hue: { start: 216, end: 204 }
    sat: { start: 0.26, end: 0.05 }
    light: { start: 7, end: 64 }
    gamma: 1.3
    count: 8

  - key: indigo
    label: 藍（寒色の影）
    role: 夜と暗所の主役。実写の影の色相中央値220度に合わせる
    hue: { start: 234, end: 214 }
    sat: { start: 0.60, end: 0.24 }
    light: { start: 4, end: 50 }
    gamma: 1.3
    count: 8

  - key: violet
    label: 青紫（月光・遠景）
    role: 月夜の環境光と、空気遠近で遠くが青紫に沈む表現
    hue: { start: 268, end: 248 }
    sat: { start: 0.40, end: 0.18 }
    light: { start: 11, end: 56 }
    gamma: 1.2
    count: 6

  - key: green
    label: 褪せた緑
    role: 夏枯れの草・杉・苔。暗端は藍に沈み、明端で黄緑になる
    hue: { start: 198, end: 104 }
    sat: { start: 0.30, end: 0.22 }
    light: { start: 9, end: 56 }
    gamma: 1.2
    count: 8

  - key: earth
    label: 土・錆・木
    role: 地面・トタン・木部・瓦。暗端は陰った赤褐色、明端で黄土になる
    hue: { start: 356, end: 36 }
    sat: { start: 0.30, end: 0.30 }
    light: { start: 8, end: 60 }
    gamma: 1.2
    count: 9

  # -------------------------------------------------------------------
  # ★ olive / warm（2026-09-04 追加）
  #
  # **緑と土のあいだの色相の穴を埋める。** 追加前の実測:
  #     色相 45〜100度        … 0色 / 64色
  #     色相 20〜50度かつ低彩度 … 0色 / 64色
  # 緑は H104〜171（最暗段 #243F3B は色相171度＝青緑）、
  # 土は H356〜36 で彩度0.30〜0.39、中性の灰は H205〜225 の青灰。
  # **8月の乾いた草（灰緑〜黄褐）も、踏み固められた日本の土（灰褐）も、
  # この64色では作れなかった。** 混ぜると緑と茶が正面から衝突し、
  # 12案すべてが迷彩柄になった。
  #
  # **彩度は既存の地の色と同等以下（0.10〜0.24）。鮮やかさは増えない。**
  # -------------------------------------------------------------------
  - key: olive
    label: 枯れた草（オリーブ）
    role: 8月の乾いた草。緑ランプが青緑に寄っているため、黄緑側を別系統で持つ
    # ★ 4段 → 6段、彩度 0.24〜0.18 → 0.18〜0.10 へ（2026-09-04）
    #
    # **主系統として使うため。** 迷彩に見える原因は「色相をまたいだ斑が
    # 同程度の面積で散らばること」であり、色を褪せさせても解けない。
    # 解は**1系統の明度差で階調を作り、他系統は少数の差し色に留める**こと。
    # 実際 tile_asphalt_curb が成功したのは、9色ありながら色相が
    # 狭かったためである。
    #
    # 主系統には (a) 段数と (b) 低い彩度 の両方が要る。
    #   4段では明度の階調が粗く、量子化の帯が出る
    #   彩度0.24 は差し色としては良いが、面積の8割を占めると緑が立つ
    hue: { start: 78, end: 64 }
    sat: { start: 0.18, end: 0.10 }
    light: { start: 18, end: 52 }
    gamma: 1.15
    count: 6

  - key: warm
    label: 暖かい中性（踏み固められた土）
    role: 踏み固められた地面・埃・褪せた木部。中性の灰は青いため、暖色側を別に持つ
    # ★ 4段 → 6段（2026-09-04）。olive と同じ理由である。
    #
    # **主系統として使うランプは6段以上が要る。** 4段では段差が明度25もあり、
    # ノイズが隣接2段を50%ずつ使うだけで**ざらつきが7.2まで上がる**。
    # これはコントラストでは下げられない。段差そのものが原因だからである。
    #   4段 段差25.3 → ざらつき7.18（目標帯 3.5〜6.0 を超える）
    #   6段 段差15.2 → ざらつき4.72 ← 目標帯
    # 参考: concrete 8段 / ink 9段。承認済みの tile_asphalt_curb が
    # 静かな面に見えるのは、細かい段差のランプを使っているためでもある。
    hue: { start: 35, end: 30 }
    sat: { start: 0.14, end: 0.10 }
    light: { start: 19, end: 49 }
    gamma: 1.15
    count: 6

  - key: skin
    label: 肌
    role: UI とアイコンで使う。キャラクター素材は本リポジトリの対象外
    hue: { start: 18, end: 28 }
    sat: { start: 0.38, end: 0.22 }
    light: { start: 30, end: 72 }
    gamma: 1.0
    count: 4

# ---------------------------------------------------------------------
# 光源色
#   **ここだけ彩度を持つことが許される。** 地の色は全て褪せている。
#   時間帯置換の対象にしない（光源は時間帯で色が変わらないため）。
# ---------------------------------------------------------------------
light_sources:
  - key: fluoro
    label: 蛍光灯の青白
    role: コンビニ・市民センター・隧道。レジームBの主光源
    colors:
      - { h: 186, s: 0.24, l: 62 }
      - { h: 182, s: 0.12, l: 88 }
  - key: vending
    label: 自販機の白緑
    role: 本作で最も彩度が許される対象。夜の唯一の色
    colors:
      - { h: 168, s: 0.52, l: 54 }
      - { h: 162, s: 0.30, l: 80 }
  - key: sodium
    label: 街灯のナトリウム橙
    role: 旧道・団地・ニュータウン。レジームAの暖色光
    colors:
      - { h: 32, s: 0.62, l: 48 }
      - { h: 38, s: 0.38, l: 74 }
  - key: moon
    label: 月の蒼白
    role: 人工光の無いフィールドの環境光
    colors:
      - { h: 224, s: 0.20, l: 56 }
      - { h: 218, s: 0.09, l: 82 }
  - key: bulb
    label: 白熱・電球色
    role: 民家の窓・駄菓子屋。生活の残留を示す唯一の暖かい光
    colors:
      - { h: 30, s: 0.44, l: 58 }
      - { h: 36, s: 0.24, l: 82 }
  - key: accent
    label: アクセント赤
    role: 自販機のボタン・のぼり・非常灯。極小面積にのみ使う
    colors:
      - { h: 4, s: 0.56, l: 42 }
      - { h: 8, s: 0.44, l: 62 }

# ---------------------------------------------------------------------
# 予備枠は設けない。
#   パレットは spec から生成されるため、後から必要になれば
#   ランプの count を1つ増やすだけで済む。意味のない色で枠を
#   埋めるより、全64色に役割を持たせるほうがよい。
# ---------------------------------------------------------------------

# ---------------------------------------------------------------------
# 時間帯置換テーブル
#   置換は「系統と段のシフト」として定義する。色を直接指定しない。
#   これにより置換先が必ずパレット内に存在することを保証できる。
#
#   to        : 写像先の系統（省略時は同系統）
#   shift     : 段のシフト量（負で暗くなる）
#   clamp     : シフトで範囲外に出たときに端へ丸める
# ---------------------------------------------------------------------
time_variants:
  day:
    label: 昼
    note: 基準。恒等写像
    rules: {}

  morning:
    label: 朝
    note: 湿度が高く、全体がわずかに明るく青い。影が短く浅い
    rules:
      indigo:   { shift: 1 }
      concrete: { shift: 1 }
      green:    { shift: 1 }
      olive:    { shift: 1 }
      earth:    { shift: 0 }
      warm:     { shift: 0 }
      violet:   { shift: 1 }
      ink:      { shift: 1 }

  dusk:
    label: 夕
    note: 光が弱り影が伸びる。中間調が土・錆側へ寄る
    rules:
      green:    { shift: -1 }
      olive:    { shift: -1 }
      concrete: { shift: -1 }
      indigo:   { shift: 0 }
      violet:   { shift: 0 }
      earth:    { shift: 0 }
      warm:     { shift: 0 }
      ink:      { shift: -1 }

  night:
    label: 夜
    note: |
      地の色が各系統の暗端へ沈む。暗端はもともと藍寄りに設計してあるため、
      別系統へ写さなくても夜になる。**素材の区別を残したまま暗くするため、
      藍ランプへ集約しない。** 集約すると草も土も道路も同じ色になる。
    rules:
      ink:      { shift: -2 }
      concrete: { shift: -2 }
      indigo:   { shift: -2 }
      violet:   { shift: -2 }
      green:    { shift: -2 }
      olive:    { shift: -2 }
      # 暖色は同じ明度でも知覚的に明るく見えるため、他系統より1段多く落とす。
      # -2 のままだと夜景で土だけが浮く（プレビューで確認済み）。
      earth:    { shift: -3 }
      # warm は彩度0.10〜0.14 と低く、夜に浮かない。-3 にすると4段が
      # 1段へ潰れるため -2 とする。
      warm:     { shift: -2 }
      skin:     { shift: -1 }
