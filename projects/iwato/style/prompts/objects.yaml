# =====================================================================
# 磐戸町奇譚 オブジェクトの発注表
#
# **66点。** production_plan.yaml の object_heights から、
# object_low 50 と object_tall 16 を取り出したもの。
# 残る25点は他の手段へ回っている（roof 14 → 屋根タイルセット5本、
# merged 6 → 統合済み、deco 3 → 納品済み、tileset_extra 2 → タイルセット側）。
#
# 生成は PixelLab の /map-objects（PILOT_FINDINGS 第19節）。
# =====================================================================

schema_version: 1
project_id: iwato

# ---------------------------------------------------------------------
# ★ 共通規約 — 全点で同じものを使う
#
# 第3節（共通プレフィックスは記述を希釈する）はタイルセットの知見であり、
# **100文字超の前置きを2つの地形の両方に付けたときの話**だった。
# オブジェクトでは前置きではなく**短い接尾辞**を使う。目的は3つ。
#
#   1. 傾きを揃える。**91点がばらばらの角度で描かれると画面が壊れる**
#   2. 光の向きを揃える。影は必ず手前（下）へ落ちる
#   3. 単体であること。背景も地面も描かせない
#
# **接尾辞は短く保つ。** 長くすると素材の記述が薄まる。
# ---------------------------------------------------------------------
common_suffix: >-
  seen from the front at a slight downward angle, lit from above,
  single object on a transparent background

# ---------------------------------------------------------------------
# 画風の共通設定
# ---------------------------------------------------------------------
style_controls:
  view: high top-down
  outline: lineless
  shading: basic shading
  detail: medium detail
  text_guidance_scale: 9.5

# ---------------------------------------------------------------------
# パレットの使い分け
#   **既定は地の色のみ（64色）。** 光源色を渡すと、光らない物まで
#   鮮やかになる（ポストと樹木が磐戸町の画面から浮いた）。
#   **自ら発光する物だけ**が全76色を使ってよい。
# ---------------------------------------------------------------------
palettes:
  default: palettes/iwato_colors_terrain.png
  luminous: palettes/iwato_colors.png

luminous:
  - obj_vending_machine
  - obj_street_light_led
  - obj_public_phone

# ---------------------------------------------------------------------
# 発注表
#   size … 出力の一辺。32/64/128。**tall は 128 を基本にする**
#   desc … 素材の記述。**特徴を並べず、何であるかを短く書く**（第3節）
# ---------------------------------------------------------------------
