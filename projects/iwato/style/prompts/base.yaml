# =====================================================================
# 磐戸町奇譚 プロンプト定義
#
# **そのまま送信できる形にしてある。** 12 generations しかない状況で、
# 1枚目を撃つ瞬間に迷いが残らないようにするためである。
#
# 送信例は各 asset の command 欄にある。
# =====================================================================

schema_version: 1
project_id: iwato

# ---------------------------------------------------------------------
# ⚠️ negative プロンプトは使えない
#
# /create-tileset と /map-objects には negative 系のパラメータが
# 存在しない（実仕様で確認済み）。/create-image-pixflux の
# negative_description は仕様上 "(Deprecated)" と明記されている。
#
# したがって除外は下の style_controls と、description の具体性で行う。
# 効く順に並べてある。詳細は STYLE_GUIDE.md の第0節。
# ---------------------------------------------------------------------
negative_prompt_support:
  create_tileset: false
  map_objects: false
  create_image_pixflux: deprecated
  note: |
    「fantasy / medieval / RPG を除外する」という指示を API に直接
    与えることはできない。排除は次の4つで行う。
      1. color_image でパレットを強制する（最強）
      2. outline: lineless で RPG スプライトの黒縁を消す
      3. detail を落として装飾過多を防ぐ
      4. description を具体的に書く（抽象的だとファンタジーへ流れる）

  # pixflux（UI・アイコンで使う予定）では一応使えるので、文言だけ用意しておく。
  # ただし Deprecated であり、効果を当てにしない。
  fallback_text_for_pixflux: >-
    fantasy, medieval, european, RPG, isometric, chibi character,
    treasure chest, sword, shield, crest, torch, barrel, cobblestone arch,
    half-timbered house, glowing magic, saturated colors, outline,
    anti-aliasing, blurry, gradient, drop shadow, watermark, text

# ---------------------------------------------------------------------
# 全生成に共通で渡す画風パラメータ
#   negative が使えない以上、ここが実質的な「除外指定」である。
# ---------------------------------------------------------------------
style_controls:
  view: high top-down          # 真上に近い見下ろし。斜めにしない
  outline: lineless            # 輪郭線を使わない規約と一致し、RPG の黒縁も消える
  shading: basic shading       # 面の陰影はノーマルマップに任せる
  detail: low detail           # 余白と単調さが不安を作る
  text_guidance_scale: 9.5     # 既定8.0より上げ、記述への忠実度を高める
  color_image: palettes/iwato_colors.png   # ★パレット強制。逸脱を抑える主手段

# ---------------------------------------------------------------------
# 共通プレフィックス
#   全ての description の先頭に置く。
#   **肯定側の具体性で殴る**（negative が使えないため）。
# ---------------------------------------------------------------------
common_prefix: >-
  pixel art for a top-down game, modern rural Japan in the 2010s,
  humid late-summer night in a small Japanese town,
  muted desaturated palette, deep indigo shadows, no outlines,

common_suffix: >-
  seen from directly above, flat top-down view, no perspective distortion,
  clean pixel edges, no anti-aliasing

# ---------------------------------------------------------------------
# 意図の対訳
#   英語のプロンプトが何を意図しているかを日本語で残す。
#   プロンプトを直すときは、まずこの意図が変わったのかを確認すること。
# ---------------------------------------------------------------------
intent_ja:
  common_prefix: |
    「見下ろしゲームのドット絵」「2010年代の現代日本の地方」
    「日本の小さな町の、湿った晩夏の夜」「褪せた低彩度のパレット」
    「深い藍の影」「輪郭線なし」。
    西洋ファンタジーを排除する語を negative に置けないため、
    「現代日本」「晩夏」「湿った」を肯定側で繰り返して寄せている。
  common_suffix: |
    「真上から見た」「平坦な見下ろし」「遠近の歪みなし」
    「くっきりした画素の縁」「アンチエイリアスなし」。
    視点の崩れとアンチエイリアスは後処理で直せないため、
    生成時点で抑えにいく。

# =====================================================================
# F06 パイロット — 4点
#   第1パスは1点1枚ずつ。8〜10 generations。
#   ここで停止して4点を並べて評価する。
# =====================================================================
pilot:
  field: F06
  pass1_note: |
    4点を1枚ずつ生成し、**必ず停止して4点を並べて見せる**。
    初回で出る問題の大半は系統的であり、1点を3回撃つと
    同じ欠陥を4回発見することになる。
  budget:
    generations_available: 12    # 残高26 − 床14
    floor: 14                    # どんな理由でも割らない
    pass1_estimate: "8〜10（タイルセット2本で6〜8、オブジェクト2点で2）"

  assets:
    # -----------------------------------------------------------------
    - id: tile_asphalt_curb
      order: 1
      endpoint: /create-tileset
      cost_estimate_generations: "3〜4"
      verifies: "**平坦な面を狙って作れるか。不規則な14本の運命を決める**"
      # ★4回目（2026-09-04）: **方向を反転させる**
      #
      # 1〜3回目はいずれも「もっと質感を」と足す方向だった。結果:
      #   1回目 lower 無地（周期性0.00 / ざらつき0.0）
      #   2回目 lower 周期性0.97 / ざらつき18.5
      #   3回目 lower 周期性1.00 / ざらつき9.3  ← レンガ壁になった
      # 参考の実写アスファルトは **周期性0.64 / ざらつき2.8** であり、
      # 生成物は3〜6倍も模様を付けすぎていた。
      #
      # **32px において「アスファルトらしさ」を作るのは模様ではない。**
      # 色・白線・光の減衰の3つである。1mスケールの粒子は32pxでは見えない。
      # 皮肉にも、失敗扱いした1回目の無地が方向として最も正しかった。
      #
      # したがって今回は**引く方向**で撃つ:
      #   - shading を flat shading（最小）に落とす
      #   - 記述からテクスチャの語を全て外す（cracked / gravel texture 等）
      #   - 代わりに uniform / featureless / smooth を明示する
      #   - 2つの地形の差は**色の明暗だけ**で付ける
      use_common_affix: false
      shading: flat shading
      detail: low detail
      color_image: palettes/iwato_colors_terrain.png
      params:
        tile_size: { width: 32, height: 32 }
        mode: standard
        transition_size: 0.0
      # ★5回目（2026-09-04）: **失敗。路面を後退させた。**
      # 統制語彙から構造の含意（sidewalk 等）を外したのは正しく効き、
      # 歩道はレンガ壁から正方格子に変わった。しかし同時に路面の記述を
      # 語彙から組み立て直した際、**4回目で効いていた
      # "no visible texture or markings" を落としてしまい**、
      # ざらつきが 0.9 → 4.0、周期性が 0.85 → 0.98 に後退した。
      # **成功した条件を保持しないまま別の変数を動かした。** 検証の失敗である。
      #
      # 判明した非対称（2回連続で同じ）:
      #   lower 周期性: 4回目 0.85 → 5回目 0.98（条件次第で平坦にできる）
      #   upper 周期性: 4回目 0.99 → 5回目 0.99（**何をしても変わらない**）
      # → **同一平面上の2素材は成立しない。** upper は必ず単位に分割される。
      #
      # ★6回目（2026-09-04）: **最後の検証。変数は upper の1点だけ。**
      #   - lower は4回目の文言を**一字一句そのまま**使う。組み立て直さない
      #   - upper を「別素材」から「lower のほぼ同一バリエーション」に変える。
      #     コンクリート／歩道にしない。同じアスファルトのわずかに明るい版
      #   - shading / detail / パレット / guidance / outline は4回目のまま
      # 6回目が失敗した場合、その場で7回目は撃たない。
      # wang_0（全面 lower）1枚だけを地面タイルとして採る案へ移る。
      # lower は fields.json の terrain_vocabulary["asphalt"] と同一。
      # upper は**この検証専用の暫定文言**であり、まだ語彙には入れていない。
      # 6回目が成功したら asphalt_light として語彙に昇格させ、
      # 不規則14本の upper をこの形に置き換える。
      # 失敗したら語彙に入れずに捨てる。**結果が出る前に fields.json の
      # 地形の組を書き換えない。**
      lower_description: >-
        a smooth uniform dark grey asphalt road surface, featureless and matte,
        no visible texture or markings
      upper_description: >-
        a smooth uniform slightly lighter grey asphalt road surface,
        featureless and matte, no visible texture or markings
      transition_description: ""
      intent_ja: |
        **模様を要求しない。** テクスチャの語を1つも入れない。
        lower は4回目に成功した文言そのものであり、**変えてはならない。**

        upper は lower と語順・語彙まで揃え、
        **違いを「dark grey」対「slightly lighter grey」の1語だけ**にした。
        upper に構造が出るのは仕組みの制約として避けられないため、
        出たとしても lower との差が小さければ格子が目立たない、という賭けである。

        判定は数値の閾値ではなく画像で行う。見るのは:
          - lower が4回目の水準（ざらつき0.9前後）を維持しているか
          - upper に格子が出ても、lower との差が小さいか
          - **4x4 に敷いて壁紙に見えないか** ← 最重要
          - パレット外0色、光源色の混入0

    # tile_concrete_slab は保留にした（2026-09-04）。
    # コンクリート×アスファルトは同一平面の組であり、1・2回目で失敗した
    # 構成そのものである。既知の欠陥に 3〜4 generations を使うのを避ける。
    # 暗部の検証は、より安価で同じ問いに答えられるオブジェクトへ置き換えた。
    # タイルセットの接続は2回とも完全に成立しており、確認済みである。
    - id: obj_bridge_pier
      order: 2
      endpoint: /map-objects
      cost_estimate_generations: "1"
      verifies: "**パレットの暗部が機能するか。常時暗い場所が成立するか**"
      use_common_affix: false
      params:
        image_size: { width: 64, height: 64 }
      detail: medium detail
      description: >-
        a massive square concrete bridge pier under a highway viaduct,
        seen from directly above, deep shadow with almost no light,
        damp stained concrete, modern Japanese infrastructure
      intent_ja: |
        暗所の検証を、タイルセットではなくオブジェクトで行う。
        見たいのは**パレットの暗部10段が識別可能な明度差を保っているか**
        であって、タイルセットの接続ではない。接続は確認済みである。

        橋脚を選んだ理由:
          - F03 高架下は「時間帯によらず暗い」本質的な暗所である
          - 単一素材（コンクリート）なので階調だけを分離して検証できる
          - 塊としての量感があり、形を読ませるには暗部の複数段が要る
          - パレットで最大面積を占める concrete ランプ（8段）を直接試せる

    - id: obj_vending_machine
      order: 3
      endpoint: /map-objects
      cost_estimate_generations: "1"
      verifies: 光源の彩度。本作で最も重要な素材
      # 共通接辞を外した。タイルセットで判明した希釈の教訓を適用する。
      # 画風は color_image と outline/shading/detail が担保している。
      use_common_affix: false
      detail: medium detail
      params:
        image_size: { width: 64, height: 64 }
      description: >-
        a Japanese roadside drink vending machine seen from directly above
        at night, its lit display panel glowing pale cyan-green,
        the glow spilling onto the dark asphalt around its base,
        modern rural Japan
      intent_ja: |
        **本作で最も重要な素材。** 彩度の高い色が許される唯一の対象。
        「lit display panel glowing pale cyan-green」で光源そのものを、
        「the glow spilling onto the asphalt around its base」で
        **光を受けた面**を同時に出させる。
        この2つが別の色で描かれるかが、レジームB成立の鍵である。
        「seen from directly above」で真上見下ろしを強制する。
      command: >-
        python tools/client.py --project iwato --kind map-object
        --name obj_vending_machine --description "<description>"
        --size 64 --view "high top-down"
        --outline lineless --shading "basic shading" --detail "medium detail"
        --guidance 9.5 --color-image palettes/iwato_colors.png
        --seed 1003 --max-images 1 --max-cost 0.20

    # -----------------------------------------------------------------
    - id: obj_civic_facade
      order: 4
      endpoint: /map-objects
      cost_estimate_generations: "1"
      verifies: 真上見下ろしで建物の高さをどう表現するか。**アプローチの検証**
      use_common_affix: false
      detail: medium detail
      params:
        image_size: { width: 128, height: 128 }
      description: >-
        a small two-storey Japanese community centre seen from directly above,
        flat roof with air conditioning units and a water tank,
        pale mortar wall visible only at the south edge,
        long cast shadow to the south
      intent_ja: |
        **これはアプローチの検証である。** 建物を 128px の単体スプライトで
        作れるのか、それともタイルで組むべきなのかを判断する。
        「flat roof with air conditioning units and a water tank」で
        **屋根が主役**であることを示し、
        「pale mortar walls barely visible at the south edge」で
        壁を手前側だけに限定し、
        「cast shadow falling to the south」で**高さを影で示す**。
        失敗した場合の報告は「プロンプトが悪い」ではなく
        「分解の仕方が違う」になり得る。
      command: >-
        python tools/client.py --project iwato --kind map-object
        --name obj_civic_facade --description "<description>"
        --size 128 --view "high top-down"
        --outline lineless --shading "basic shading" --detail "medium detail"
        --guidance 9.5 --color-image palettes/iwato_colors.png
        --seed 1004 --max-images 1 --max-cost 0.20

    # 投影の検証（2026-09-04）。/map-objects は view: high top-down を送っても
    # アイソメトリックで出力される。/create-image-pixflux にだけ isometric
    # パラメータが存在するため、それを false にして比較する。
    # **記述・サイズ・パレットは obj_vending_machine と完全に同一にし、
    # 変数を投影だけに絞る。**
    - id: obj_vending_machine_pixflux
      order: 5
      endpoint: /create-image-pixflux
      cost_estimate_generations: "1"
      verifies: "**真上見下ろし（正射影）が出せるか。投影の検証**"
      use_common_affix: false
      detail: medium detail
      params:
        image_size: { width: 64, height: 64 }
        isometric: false
        no_background: true
      description: >-
        a Japanese roadside drink vending machine seen from directly above at night, its lit display panel glowing pale cyan-green, the glow spilling onto the dark asphalt around its base, modern rural Japan
      intent_ja: |
        /map-objects 版と記述を1文字も変えていない。投影だけが変数である。
        isometric: false を明示し、no_background で透過を作る。
        質が落ちていないかも比較する。投影が直っても素材として
        劣化するなら、別の解決策が要る。

    # ------------------------------------------------------------------
    # 検証 7（2026-09-04）: **PixelLab が得意な素材の実力を見る**
    #
    # 1〜6回目はすべて不規則な地形（アスファルト・コンクリート）だった。
    # **不得意な素材だけを6回見て、道具の実力を評価してきた。**
    # 規則15本に属する瓦屋根を1本作り、得意な側の天井を知る。
    #
    # ★ shading を flat → detailed に上げる（**今回変える唯一の変数**）
    #   3回目は detailed shading + low detail で「規則的なブロックの陰影」を
    #   生み、アスファルトとしては失敗した（ざらつき lower 6.8 / upper 17.1）。
    #   **しかし瓦は規則的なブロックそのものである。**
    #   3回目の失敗は材質の不一致であって、パラメータの誤りではなかった。
    #   同じ組み合わせ（detailed shading + low detail）を、
    #   それが正解になる素材へ当てる。
    #
    #   flat shading のままでは瓦にならない。真上から見た瓦を瓦たらしめるのは
    #   **桟の稜線と谷の影**であり、それは陰影でしか描けない。
    #   ノーマルマップは実行時に光を足すだけで、焼かれた階調が無ければ
    #   照らすものが無い（4回目の教訓）。
    #
    # ★ detail は low のまま維持する。6回目から変えない。
    #   32px は約1m。瓦1枚は幅30cm 程度で、1タイルに3列×4段しか入らない。
    #   detail を上げると1m四方に描けない密度を要求することになり、
    #   1〜3回目で繰り返した「模様の付けすぎ」を再演する。
    #
    # ★ no visible texture or markings は**使わない**。
    #   瓦は模様があるのが正しい。あの句は平坦な面のための道具である。
    #
    # ★ lower / upper の組み方: **瓦の平面 × 棟（むね）**
    #   - 棟は瓦屋根で唯一の**本当に高い部分**であり、tileset_a（高低差あり・
    #     実証済み）に当てはまる。分類 tileset_roof の初検証としても素直
    #   - 第8節と第9節で問題になった「upper が単位に分割され、縁を持つ」性質が、
    #     **棟では正しい描写になる。** 棟は実際に区切られた稜であり、縁を持ち、
    #     影を落とす。**6回目の欠陥が、ここでは機能に変わる**かを見る
    #   - 濃淡の組（6回目の方式）は安全だが、それでは
    #     「得意な素材で何が出せるか」という問いに答えられない
    #   - 樋は軒先の線であって面ではない。Wang の地形には向かない
    # ------------------------------------------------------------------
    - id: roof_kawara
      order: 7
      endpoint: /create-tileset
      cost_estimate_generations: "3"
      verifies: "**規則15本の見通し。PixelLab が得意な素材の天井**"
      use_common_affix: false
      shading: detailed shading      # ★ 6回目から変える唯一の変数
      detail: low detail             # 6回目のまま
      color_image: palettes/iwato_colors_terrain.png
      params:
        tile_size: { width: 32, height: 32 }
        mode: standard
        transition_size: 0.0
      lower_description: >-
        dark blue-grey japanese kawara clay roof tiles in even overlapping rows
      upper_description: >-
        a raised ridge of dark blue-grey capping tiles running along the roof crest
      transition_description: ""
      intent_ja: |
        いぶし銀の瓦。パレットの indigo / ink ランプに素直に収まる色である。
        「even overlapping rows」で瓦の重なりを、
        「raised ridge / capping tiles / roof crest」で棟を指す。
        共通接辞は付けない（第3節の希釈）。

        判定:
          - **瓦屋根として認識できるか**
          - 敷き詰めて建物の屋根に見えるか
          - 参考画像の質感（ざらつき2.8前後）に近づいているか
          - パレット外0色、光源色0

    # ------------------------------------------------------------------
    # 検証 a-1（2026-09-04）: 高さのある単体物をタイルセットで作れるか
    #
    # 電柱は12フィールドで使う最頻の素材であり、**この1点の成否が
    # 未解決16点の方針をほぼ決める。**
    #
    # タイルセットは均質な素材を作る仕組みなので、1点の物には
    # 向かない可能性が高い。ただし角が1つだけ upper のタイルを
    # 2x2 で並べると孤立した丸い塊が作れるため、
    # 「上から見た電柱の断面」が得られる可能性がある。
    # ------------------------------------------------------------------
    - id: verify_utility_pole_tileset
      order: 6
      endpoint: /create-tileset
      cost_estimate_generations: "3〜4"
      verifies: "**1点の物をタイルセットで作れるか。未解決16点の方針を決める**"
      use_common_affix: false
      params:
        tile_size: { width: 32, height: 32 }
        mode: standard
        transition_size: 0.0
      lower_description: >-
        cracked grey asphalt road surface with fine gravel texture
      upper_description: >-
        the top of a grey concrete utility pole seen from directly above,
        a round cross-section with a dark cap and cable brackets
      transition_description: ""
      intent_ja: |
        lower を地面、upper を「真上から見た電柱の上面」にする。
        全面 upper のタイルは電柱の材質が一面に広がるだけで使えないが、
        **角が1つだけ upper のタイルを 2x2 で並べれば孤立した丸い塊**
        になり、それが電柱の断面として使える可能性がある。

        判定軸:
          1. 真上見下ろし（正射影）になっているか
          2. **電柱として認識できるか**
          3. 16タイルのうち実際に使えるのが何枚か
             （1点の物なら大半が無駄になるはず）
          4. パレット適合

        3番目が重要である。**「作れる」と「作るべき」は別問題**であり、
        1点の物のために16タイル分を使うのが非効率なら、
        作れたとしても採用しない判断があり得る。

# =====================================================================
# パイロットで結論を出す確認手順
#   **結果がどうであれ結論を出す。** 判断を先送りしない。
# =====================================================================
verification:

  - id: light_vs_lit_surface
    title: 自販機の光が地面に落ちる部分に、どの色を使うか
    asset: obj_vending_machine
    why: |
      vending[1] (#4DC7AE, 彩度0.52) は他の63色から完全に浮く。
      光源そのものとしては意図どおりだが、**その光が地面を照らす部分に
      何を使うか**が未定である。そのまま置くと明るすぎるはずで、
      実際には concrete / green / fluoro の中間段になる。
      「光源そのものの色」と「光を受けた面の色」の使い分けが
      本作の夜景の成否を決める。レジームBの中心問題でもある。
    procedure:
      - 生成物を後処理してパレットへ吸着させる
      - 使われた色を系統別に数える（tools/validate_assets.py が色数を出す）
      - 自販機の面（光源）と、その足元の地面（受光面）で別の色が
        使われているかを確認する
      - 受光面に使われた色の系統（concrete / green / fluoro のどれか）を特定する
    conclusion_goes_to: STYLE_GUIDE.md 第1節「レジーム B」と第8節①
    if_fails: |
      受光面が光源と同じ色で描かれた場合、または受光面が描かれない場合は、
      プロンプトで光の落ち方を明示する余地がある。ただし2回試して
      出なければ、**後処理で受光面を描き足す設計**に切り替える提案をする。

  - id: dark_field_viability
    title: 夜の38色で、常時暗いフィールドが成立するか
    asset: tile_concrete_slab
    why: |
      夜の置換で地の色52色のうち14色が潰れ、実質38色になる。
      F03（隧道）や F16（禁域）のような常時暗いフィールドで
      使える色が38色ということである。
    procedure:
      - 生成物を後処理してパレットへ吸着させる
      - 使われた色の数と、その明度分布を数える
      - "**16タイルを並べて、暗所として形が読めるかを目視する**"
      - 夜の置換を適用した状態でも同じ確認をする
    threshold: |
      1タイルあたり4色以上が暗部（明度30以下）から使われ、
      かつタイル同士の境界が識別できること。
    conclusion_goes_to: STYLE_GUIDE.md 第8節②
    if_fails: |
      palette_spec.yaml の concrete / indigo / ink の count を増やすか、
      gamma を上げて暗部の段を厚くする。**パレットは spec から
      再生成できる。** 変更する場合は理由と影響範囲を明示し、
      build_palette.py の置換検証を再実行する。

  - id: tileset_connectivity
    title: 16タイルが継ぎ目なく繋がるか
    asset: tile_asphalt_curb / tile_concrete_slab
    why: |
      **単体で綺麗でも接続で破綻すれば意味がない。**
      Wang タイルとして16枚が繋がるかが本質であり、
      破綻はプロンプトではなくアプローチの失敗である。
    procedure:
      - 16タイルを取得し、実際に並べた画像を組み立てる
      - 継ぎ目、角の連続性、繰り返しの目立ちを確認する
      - "**組み立てた画像を提示する**"
    conclusion_goes_to: 報告

  - id: building_decomposition
    title: 建物をどう作るべきか
    asset: obj_civic_facade
    why: |
      **F02 / F05 / F11 / F12 / F13 の建物すべてに波及する。**
      ここが決まらないと量産の設計が決まらない。
    procedure:
      - 屋根が主役になっているか（壁が出すぎていないか）
      - 落ち影で高さが読めるか
      - 128px スプライトとしてタイルマップに置いたとき、
        32px グリッドと整合するか
    conclusion_goes_to: STYLE_GUIDE.md 第2節と第8節③
    note: |
      **結果がどうであれ「建物はどう作るべきか」の結論を出す。**
      単体スプライト（案A）か、タイルで組む（案B）かを決める。

